<!DOCTYPE html>
<html lang="pt-PT">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <title>Álbum Mágico</title>

    <link rel="stylesheet" href="./style.css">

    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  </head>

  <body>
    <!-- ================================
         TELA INICIAL
    ================================= -->
    <div id="start-screen">
      <div class="marquee">
        <div class="track">
          <img src="carrossel.png" alt>
          <img src="carrossel.png" alt>
          <img src="carrossel.png" alt>
          <img src="carrossel.png" alt>
        </div>
      </div>

      <div class="welcome-content">
        <div class="heart">♡</div>
        <h1>Álbum Mágico</h1>
        <div class="divider">
          <span></span>
          <small>para si</small>
          <span></span>
        </div>
        <p>
          Algumas memórias merecem<br>
          ganhar vida.
        </p>
        <button id="start-btn">
          <span class="camera-icon">⌾</span>
          <span>Começar</span>
        </button>
        <div class="hint">
          Aponte a câmara para uma das fotografias
        </div>
      </div>
    </div>

    <!-- ================================
         TELA DE CARREGAMENTO
    ================================= -->

      <div class="welcome-content">
        <div class="heart">♡</div>
        <h2>A carregar vídeo...</h2>
        <p id="loading-progress">Aguarde um momento...</p>
      </div>
    </div>

    <!-- ================================
         BOTÃO VOLTAR
    ================================= -->
    <button id="back-btn" aria-label="Voltar">
      <span>‹</span>
    </button>

    <!-- ================================
         EXPERIÊNCIA AR
    ================================= -->
    <a-scene
      mindar-image="
        imageTargetSrc: ./targets.mind;
        autoStart: false;
        uiScanning: yes;
      "
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false">

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity class="ar-target" mindar-image-target="targetIndex: 0" data-video="vid-1">
        <a-plane position="0 0 0" height="1.75" width="1" material="transparent: true; opacity: 0;"></a-plane>
      </a-entity>

      <a-entity class="ar-target" mindar-image-target="targetIndex: 1" data-video="vid-2">
        <a-plane position="0 0 0" height="0.75" width="1" material="transparent: true; opacity: 0;"></a-plane>

      </a-entity>

      </a-entity>

      </a-entity>

      <a-entity class="ar-target" mindar-image-target="targetIndex: 21" data-video="vid-22">
        <a-plane position="0 0 0" height="2" width="1" material="transparent: true; opacity: 0;"></a-plane>
      </a-entity>
    </a-scene>

    <script>
      const startScreen = document.getElementById('start-screen');
      const loadingScreen = document.getElementById('loading-screen');
      const loadingProgress = document.getElementById('loading-progress');
      const startBtn = document.getElementById('start-btn');
      const backBtn = document.getElementById('back-btn');
      const sceneEl = document.querySelector('a-scene');

      const targets = document.querySelectorAll('.ar-target');
      const videos = document.querySelectorAll('#video-cache video');

      let cameraStarted = false;
      let currentVideo = null;

      function showLoading(message = 'A carregar vídeo...') {
          loadingProgress.textContent = message;
          loadingScreen.style.display = 'flex';
      }

      function hideLoading() {
          loadingScreen.style.display = 'none';
      }

      function loadVideo(video) {
          return new Promise((resolve, reject) => {
              if (video.dataset.loaded === 'true' && video.readyState >= 2 && video.videoWidth > 0) {
                  resolve();
                  return;
              }

              const onLoadedData = () => {
                  cleanup();
                  video.dataset.loaded = 'true';
                  video.dataset.loading = 'false';
                  resolve();
              };

              const onError = () => {
                  cleanup();
                  video.dataset.loading = 'false';
                  reject(new Error(`Não foi possível carregar ${video.dataset.src}`));
              };

              const cleanup = () => {
                  video.removeEventListener('loadeddata', onLoadedData);
                  video.removeEventListener('error', onError);
              };

              video.addEventListener('loadeddata', onLoadedData);
              video.addEventListener('error', onError);

              if (!video.src || video.src === window.location.href) {
                  video.dataset.loading = 'true';
                  video.src = video.dataset.src;
                  video.load();
              }
          });
      }

      function stopOtherVideos(exceptVideo) {
          videos.forEach(video => {
              if (video !== exceptVideo) {
                  video.pause();
              }
          });
      }

      function preloadNextVideo(currentTargetIndex) {
          const nextTargetIndex = currentTargetIndex + 1;
          if (nextTargetIndex >= targets.length) return;

          const nextTarget = targets[nextTargetIndex];
          const nextVideoId = nextTarget.getAttribute('data-video');
          const nextVideo = document.getElementById(nextVideoId);
          if (!nextVideo || nextVideo.dataset.loaded === 'true') return;

          loadVideo(nextVideo).catch(() => {});
      }

      startBtn.addEventListener('click', async () => {
          startScreen.classList.add('hidden');
          setTimeout(() => {
              startScreen.style.display = 'none';
          }, 500);

          backBtn.classList.add('visible');
          cameraStarted = true;

          try {
              await sceneEl.systems['mindar-image-system'].start();
          } catch (error) {
              console.error('Não foi possível iniciar a câmara:', error);
          }
      });

      backBtn.addEventListener('click', () => {
          if (!cameraStarted) return;

          try {
              sceneEl.systems['mindar-image-system'].stop();
          } catch (error) {
              console.log('Erro ao parar a câmara:', error);
          }

          videos.forEach(video => video.pause());
          currentVideo = null;
          cameraStarted = false;
          backBtn.classList.remove('visible');

          startScreen.style.display = 'flex';
          requestAnimationFrame(() => {
              startScreen.classList.remove('hidden');
          });
      });

      targets.forEach((target, targetIndex) => {
          const videoId = target.getAttribute('data-video');
          const video = document.getElementById(videoId);
          const plane = target.querySelector('a-plane');

          if (!video) return;

          target.addEventListener('targetFound', async () => {
              stopOtherVideos(video);
              currentVideo = video;

              try {
                  if (video.dataset.loaded !== 'true' || video.videoWidth === 0) {
                      showLoading('A preparar memória...');
                      await loadVideo(video);
                      hideLoading();
                  }

                  if (currentVideo !== video) return;

                  // Atualiza a textura e torna o plano visível apenas com o primeiro fotograma válido
                  plane.setAttribute('material', {
                      shader: 'flat',
                      src: video,
                      transparent: false,
                      opacity: 1
                  });

                  video.currentTime = 0;
                  await video.play();

                  preloadNextVideo(targetIndex);
              } catch (error) {
                  hideLoading();
                  console.error(`Erro ao reproduzir ${videoId}:`, error);
              }
          });

          target.addEventListener('targetLost', () => {
              if (currentVideo === video) {
                  video.pause();
              }
          });
      });
    </script>
  </body>
</html>
