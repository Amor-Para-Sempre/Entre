  <script>
    const startScreen = document.getElementById('start-screen');
    const startBtn = document.getElementById('start-btn');
    const backBtn = document.getElementById('back-btn');
    const sceneEl = document.querySelector('a-scene');
    const targets = document.querySelectorAll('.ar-target');
    const videos = document.querySelectorAll('video');
    let cameraStarted = false;

    startBtn.addEventListener('click', async () => {
      startScreen.classList.add('hidden');
      setTimeout(() => {
        startScreen.style.display = 'none';
      }, 500);
      backBtn.classList.add('visible');
      videos.forEach(video => {
        video.load();
      });
      cameraStarted = true;
      await sceneEl.systems['mindar-image-system'].start();
    });

    /*
    * BOTÃO VOLTAR
    */
    backBtn.addEventListener('click', async () => {
      if (!cameraStarted) {
        return;
      }
      try {
        sceneEl.systems['mindar-image-system'].stop();
      } catch (error) {
        console.log(error);
      }
      // Para todos os vídeos
      videos.forEach(video => {
        video.pause();
        video.currentTime = 0;
      });
      cameraStarted = false;
      // Esconde botão
      backBtn.classList.remove('visible');
      // Volta para tela inicial
      startScreen.style.display = 'flex';
      requestAnimationFrame(() => {
        startScreen.classList.remove('hidden');
      });
    });

    /*
    * CONTROLE DOS VÍDEOS
    */
    targets.forEach(target => {
      const videoId = target.getAttribute('data-video');
      const video = document.getElementById(videoId);
      target.addEventListener('targetFound', () => {
        video.play().catch(error => {
          console.log('Não foi possível iniciar o vídeo:', error);
        });
      });
      target.addEventListener('targetLost', () => {
        video.pause();
        video.currentTime = 0;
      });
    });
  </script>
