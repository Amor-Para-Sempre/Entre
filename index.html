<!DOCTYPE html>

<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Nossos Momentos ♡</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --rose: #d99a9f;
      --rose-light: #edc2c4;
      --gold: #c9a86a;
      --text: #f8f2f3;
      --muted: #b9a9ae;
      --dark: #0d0a0c;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;

      padding: 30px 18px;

      font-family: 'Montserrat', sans-serif;
      color: var(--text);

      background:
        radial-gradient(
          circle at 50% 0%,
          rgba(132, 72, 82, 0.28),
          transparent 38%
        ),
        radial-gradient(
          circle at 0% 100%,
          rgba(87, 48, 58, 0.20),
          transparent 35%
        ),
        linear-gradient(
          145deg,
          #21151a 0%,
          #110d10 48%,
          #080709 100%
        );

      overflow-x: hidden;
    }

    /* Pequenos pontos de luz no fundo */

    body::before,
    body::after {
      content: "";
      position: fixed;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      filter: blur(90px);
      pointer-events: none;
      opacity: 0.16;
    }

    body::before {
      background: var(--rose);
      top: -180px;
      left: -120px;
    }

    body::after {
      background: var(--gold);
      bottom: -180px;
      right: -120px;
    }

    /* Container principal */

    .container {
      position: relative;
      width: 100%;
      max-width: 430px;

      padding: 48px 26px 34px;

      text-align: center;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,0.065),
          rgba(255,255,255,0.018)
        );

      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 30px;

      box-shadow:
        0 30px 80px rgba(0,0,0,0.55),
        inset 0 1px 0 rgba(255,255,255,0.06);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      overflow: hidden;

      animation: containerIn 1s ease both;
    }

    /* brilho superior do cartão */

    .container::before {
      content: "";
      position: absolute;
      top: 0;
      left: 12%;
      right: 12%;
      height: 1px;

      background: linear-gradient(
        90deg,
        transparent,
        rgba(237,194,196,0.55),
        transparent
      );
    }

    @keyframes containerIn {
      from {
        opacity: 0;
        transform: translateY(18px) scale(0.98);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Cabeçalho */

    .header {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .heart-badge {
      position: relative;

      width: 62px;
      height: 62px;

      display: flex;
      align-items: center;
      justify-content: center;

      margin-bottom: 20px;

      font-family: 'Cormorant Garamond', serif;
      font-size: 34px;
      font-weight: 300;

      color: var(--rose-light);

      border: 1px solid rgba(217,154,159,0.25);
      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(217,154,159,0.14),
          rgba(217,154,159,0.025) 70%
        );

      box-shadow:
        0 0 30px rgba(217,154,159,0.10),
        inset 0 0 20px rgba(255,255,255,0.025);

      animation: heartFloat 3.5s ease-in-out infinite;
    }

    .heart-badge::before,
    .heart-badge::after {
      content: "";
      position: absolute;
      top: 50%;
      width: 32px;
      height: 1px;

      background: linear-gradient(
        90deg,
        transparent,
        rgba(217,154,159,0.35)
      );
    }

    .heart-badge::before {
      right: 100%;
      margin-right: 14px;
    }

    .heart-badge::after {
      left: 100%;
      margin-left: 14px;

      transform: rotate(180deg);
    }

    @keyframes heartFloat {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-4px);
      }
    }

    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2.5rem, 10vw, 3.2rem);
      font-weight: 400;
      line-height: 0.95;
      letter-spacing: 0.5px;

      color: #fff;

      margin-bottom: 13px;

      text-shadow:
        0 4px 25px rgba(0,0,0,0.35);
    }

    .subtitle {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.15rem;
      font-style: italic;
      font-weight: 300;

      color: var(--rose-light);

      letter-spacing: 0.3px;

      margin-bottom: 38px;

      opacity: 0.85;
    }

    /* Linha decorativa */

    .divider {
      display: flex;
      align-items: center;
      justify-content: center;

      width: 100%;
      margin-bottom: 28px;

      gap: 10px;
    }

    .divider-line {
      height: 1px;
      flex: 1;

      background: linear-gradient(
        90deg,
        transparent,
        rgba(201,168,106,0.30)
      );
    }

    .divider-line:last-child {
      background: linear-gradient(
        90deg,
        rgba(201,168,106,0.30),
        transparent
      );
    }

    .divider-symbol {
      font-family: 'Cormorant Garamond', serif;
      font-size: 15px;

      color: var(--gold);
      opacity: 0.8;
    }

    /* Cards */

    .links-wrapper {
      width: 100%;

      display: flex;
      flex-direction: column;

      gap: 14px;

      margin-bottom: 34px;
    }

    .card-link {
      position: relative;

      display: flex;
      align-items: center;

      width: 100%;

      padding: 17px 17px;

      text-decoration: none;

      background:
        linear-gradient(
          120deg,
          rgba(255,255,255,0.055),
          rgba(255,255,255,0.018)
        );

      border: 1px solid rgba(255,255,255,0.085);
      border-radius: 20px;

      overflow: hidden;

      transition:
        transform 0.35s ease,
        border-color 0.35s ease,
        background 0.35s ease,
        box-shadow 0.35s ease;

      animation: cardIn 0.7s ease both;
    }

    .card-link:nth-child(2) {
      animation-delay: 0.12s;
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .card-link::before {
      content: "";

      position: absolute;
      inset: 0;

      background:
        radial-gradient(
          circle at 0% 50%,
          rgba(217,154,159,0.14),
          transparent 45%
        );

      opacity: 0;

      transition: opacity 0.35s ease;
    }

    .card-link:hover {
      transform: translateY(-3px);

      border-color: rgba(217,154,159,0.28);

      background:
        linear-gradient(
          120deg,
          rgba(255,255,255,0.075),
          rgba(255,255,255,0.025)
        );

      box-shadow:
        0 14px 30px rgba(0,0,0,0.30),
        0 0 25px rgba(217,154,159,0.05);
    }

    .card-link:hover::before {
      opacity: 1;
    }

    .card-link:active {
      transform: scale(0.985);
    }

    .card-content {
      position: relative;
      z-index: 1;

      display: flex;
      align-items: center;

      gap: 15px;

      flex: 1;

      text-align: left;
    }

    /* Ícone */

    .icon-box {
      width: 48px;
      height: 48px;

      flex-shrink: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 20px;

      border-radius: 15px;

      background:
        linear-gradient(
          145deg,
          rgba(217,154,159,0.16),
          rgba(217,154,159,0.045)
        );

      border: 1px solid rgba(217,154,159,0.18);

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.04);
    }

    .card-text {
      min-width: 0;
    }

    .card-text h2 {
      font-family: 'Cormorant Garamond', serif;

      font-size: 1.38rem;
      font-weight: 500;

      color: #fff;

      line-height: 1.05;

      margin-bottom: 5px;
    }

    .card-text p {
      font-size: 0.69rem;
      font-weight: 300;

      color: var(--muted);

      line-height: 1.4;

      letter-spacing: 0.15px;
    }

    /* Seta */

    .arrow {
      position: relative;
      z-index: 1;

      display: flex;
      align-items: center;
      justify-content: center;

      width: 30px;
      height: 30px;

      margin-left: 8px;

      border-radius: 50%;

      color: #8f7d83;

      font-family: Arial, sans-serif;
      font-size: 20px;
      font-weight: 300;

      transition:
        transform 0.3s ease,
        color 0.3s ease,
        background 0.3s ease;
    }

    .card-link:hover .arrow {
      transform: translateX(3px);

      color: var(--rose-light);

      background: rgba(217,154,159,0.08);
    }

    /* Rodapé */

    footer {
      display: flex;
      align-items: center;
      justify-content: center;

      gap: 9px;

      font-family: 'Cormorant Garamond', serif;

      font-size: 1rem;
      font-style: italic;
      font-weight: 300;

      color: #8f7e84;
    }

    footer span {
      color: var(--rose);
      font-style: normal;
      font-size: 14px;
    }

    /* Mobile */

    @media (max-width: 380px) {
      .container {
        padding: 40px 20px 30px;
        border-radius: 26px;
      }

      h1 {
        font-size: 2.35rem;
      }

      .subtitle {
        margin-bottom: 32px;
      }

      .card-link {
        padding: 15px;
      }

      .icon-box {
        width: 44px;
        height: 44px;
      }

      .card-text h2 {
        font-size: 1.25rem;
      }
    }

    /* Acessibilidade */

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>

</head>

<body>

  <main class="container">

<header class="header">

  <div class="heart-badge">♡</div>

  <h1>Nossos Momentos</h1>

  <p class="subtitle">
    uma pequena coleção de nós
  </p>

</header>

<div class="divider">
  <span class="divider-line"></span>
  <span class="divider-symbol">✦</span>
  <span class="divider-line"></span>
</div>

<section class="links-wrapper">

  <a href="./Familia/Ayane.html" class="card-link">

    <div class="card-content">

      <div class="icon-box">
        📷
      </div>

      <div class="card-text">
        <h2>Álbum Mágico</h2>
        <p>Fotos que ganham vida com a câmera</p>
      </div>

    </div>

    <span class="arrow">›</span>

  </a>


  <a href="./ayane-santiago.html" class="card-link">

    <div class="card-content">

      <div class="icon-box">
        ♡
      </div>

      <div class="card-text">
        <h2>Nosso Tempo Juntos</h2>
        <p>Cada segundo ao seu lado</p>
      </div>

    </div>

    <span class="arrow">›</span>

  </a>

</section>

<footer>
  <span>♡</span>
  para sempre nós dois
  <span>♡</span>
</footer>
  </main>

</body>
</html>
